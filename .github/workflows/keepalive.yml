# Supabase's free tier pauses a project after 7 days without activity.
# This free GitHub Action pings it every 3 days so it never sleeps.
# Add repo secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings → Secrets → Actions).
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "No SUPABASE_URL secret set — skipping"; exit 0; fi
          curl -fsS "$SUPABASE_URL/rest/v1/records?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -o /dev/null -w "HTTP %{http_code}\n"
